<h2 mat-dialog-title>Movimientos</h2>

<div mat-dialog-content>
  <table mat-table [dataSource]="movimientos" class="mat-elevation-z8 w-100">
    
    <!-- Fecha -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> Fecha </th>
      <td mat-cell *matCellDef="let m"> {{ m.date | date:'short' }} </td>
    </ng-container>

    <!-- Tipo -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef> Tipo </th>
      <td mat-cell *matCellDef="let m"> {{ m.type }} </td>
    </ng-container>

    <!-- Monto -->
    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef> Monto </th>
      <td mat-cell *matCellDef="let m"> ${{ m.amount }} </td>
    </ng-container>

    <!-- Descripción -->
<!--     <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef> Descripción </th>
      <td mat-cell *matCellDef="let m"> {{ m.description }} </td>
    </ng-container> -->

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <p *ngIf="movimientos.length === 0" class="text-center">
    No hay movimientos registrados.
  </p>
</div>

<div mat-dialog-actions align="end">
  <button mat-stroked-button color="primary" (click)="close()">Cerrar</button>
</div>
