<app-header />
<div class="login-bg">
    <div class="header-login">
        <div class="mascota">
            <img src="../../../assets/images/dyn_mascota.png" alt="Logo Empresa" />
        </div>

    </div>
    <div class="form-content">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" autocomplete="off">
            <h2>Bienvenido</h2>

            <div class="form-group">
                <!-- <label for="email">Correo electrónico</label> -->
                <div class="email-wrapper">
                    <input id="email" type="email" formControlName="email"
                        [class.invalid]="email.invalid && email.touched" placeholder="jhon@correo.com" />
                </div>
                <div class="error" *ngIf="email.invalid && email.touched">
                    <span *ngIf="email.errors?.['required']">El correo es obligatorio.</span>
                    <span *ngIf="email.errors?.['email']">Formato de correo inválido.</span>
                </div>
            </div>

            <div class="form-group">
                <!-- <label for="password">Contraseña</label> -->
                <div class="password-wrapper">
                    <input id="password" [type]="hidePassword ? 'password' : 'text'" formControlName="password"
                        [class.invalid]="password.invalid && password.touched" placeholder="********" />
                    <button type="button" class="toggle" (click)="togglePasswordVisibility()">
                        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
                </div>
                <div class="error" *ngIf="password.invalid && password.touched">
                    <span *ngIf="password.errors?.['required']">La contraseña es obligatoria.</span>
                </div>
            </div>

            <button type="submit" [disabled]="loading || loginForm.invalid">
                <span *ngIf="!loading">Ingresar</span>
                <span *ngIf="loading" class="spinner"></span>
            </button>

            <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
            <!-- Enlaces adicionales dentro del formulario -->
            <div class="extra-links">
                <!-- <a routerLink="/olvide">¿Olvidaste tu contraseña?</a> -->
                <span>¿Aun no tienes una cuenta? <a routerLink="/register">Regístrate</a></span>
            </div>
        </form>
    </div>
</div>
<app-footer/>
