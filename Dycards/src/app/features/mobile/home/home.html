<div class="perfil">
    <div class="user-profile" *ngIf="user">
        <div class="user-profile__photo">
            <img [src]="avatarUrl" alt="Foto de perfil">
            <!-- <img [src]="'https://dyncards.com/imagenes/perfiles/' + user.profileImage" /> -->

        </div>

        <div class="user-profile__info">
            <div class="user-profile__info-name">{{ user.name }}</div>
            <!-- <div class="user-profile__info-email">{{ user.email }}</div> -->
            <div class="user-profile__info-phone">{{ user.phone }}</div>
            <div class="user-profile__info-codigo">{{ user.codigo }}</div>
            <div class="terminos-condiciones">
                <p>¡Atención!</p>
                <i (click)="openInfo()" class="fa-solid fa-circle-info"></i>
            </div>
        </div>
    </div>

    <div class="home-container separador">
        <!-- Iconos de contacto -->
        <div class="contact-icons">
            <a href="mailto:dynamichco@gmail.com" target="_blank">
                <img src="assets/images/icons/emd.png" alt="Email">
            </a>
            <a href="https://wa.me/573243340211" target="_blank">

                <img src="assets/images/icons/wsd.png" alt="WhatSap">
            </a>
            <a href="tel:+573243340211" target="_blank">
                <img src="assets/images/icons/phd.png" alt="Phone">
            </a>
        </div>
